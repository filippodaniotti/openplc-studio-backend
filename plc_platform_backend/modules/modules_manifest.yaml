      - name: num_mel_bins
        type: int
        default: 100
        values: null
        validation:
          min: 1
    constraints:
      - type: length_relation
        setting: crossfade
        related_setting: crossfade_frequencies
        offset: 1
        message: >-
          The number of crossfade settings must be one more than the number of
          crossfade frequencies.
      - type: less_than
        setting: lower_edge_hertz
        related_setting: upper_edge_hertz
        message: "The lower edge must be less than the upper edge."

  - name: PARCnetPLC
