PacketLossSimulator:
  - name: BinomialPLS
    settings:
      - name: seed
        type: int
        default: 1
        values: null
      - name: packet_size
        type: int
        default: 32
        values: null
        validation:
          min: 1
      - name: per
        type: float
        default: 0.0001
        values: null
        validation:
          min: 0
          max: 1

  - name: MetronomePLS
    settings:
      - name: seed
        type: int
        default: 1
        values: null
      - name: packet_size
        type: int
        default: 32
        values: null
        validation:
          min: 1
      - name: period
        type: int
        default: 100
        values: null
      - name: duration
        type: int
        default: 5
        values: null
      - name: offset
        type: int
        default: 0
        values: null

  - name: GilbertElliotPLS
    settings:
      - name: seed
        type: int
        default: 1
        values: null
      - name: packet_size
        type: int
        default: 32
        values: null
        validation:
          min: 1
      - name: p
        type: float
        default: 0.001
        values: null
        validation:
          min: 0
          max: 1
      - name: r
        type: float
        default: 0.05
        values: null
        validation:
          min: 0
          max: 1
      - name: h
        type: float
        default: 0.5
        values: null
        validation:
          min: 0
          max: 1
      - name: k
        type: float
        default: 0.999999
        values: null
        validation:
          min: 0
          max: 1

  - name: CustomMaskPLS
    settings:
      - name: packet_size
        type: int
        default: 32
        values: null
        validation:
          min: 1
      - name: mask
        type: str
        default: "0101"
        values: null
        validation:
          min_length: 1
          pattern: "^[01]+$"
      - name: invert
        type: bool
        default: False
        values: null

PLCAlgorithm:
  - name: AdvancedPLC
    settings:
      - name: band_settings
        type: dict_str_list_PLCSettings
        default:
          left:
            - name: ZerosPLC
              settings: []
          right:
            - name: ZerosPLC
              settings: []
        values: null
      - name: frequencies
        type: dict_str_list_int
        default:
          left: []
          right: []
        values: null
        validation:
          item:
            min: 0
            max: 20000
          sorted: ascending
      - name: order
        type: int
        default: 4
        values: null
        validation:
          min: 1
      - name: stereo_image_processing
        type: Enum
        default: dual_mono
        values:
          - dual_mono
          - mid_side
      - name: channel_link
        type: bool
        default: false
        values: null
    constraints:
      - type: keys_match
        setting: band_settings
        related_setting: frequencies
        allowed_key_sets:
          - [linked]
          - [left, right]
          - [mid, side]
        message: >-
          The channel keys must be either linked, left/right or mid/side.
      - type: per_key_length_relation
        setting: frequencies
        related_setting: band_settings
        offset: -1
        message: >-
          Each channel must have one more algorithm than its crossfade
          frequencies.

  - name: ZerosPLC
    settings:
      - name: crossfade
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: fade_in
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: crossfade_frequencies
        type: list_int
        default: []
        values: null
        validation:
          item:
            min: 0
            max: 20000
          sorted: ascending
      - name: crossover_order
        type: int
        default: 4
        values: null
        validation:
          min: 1
    constraints:
      - type: length_relation
        setting: crossfade
        related_setting: crossfade_frequencies
        offset: 1
        message: >-
          The number of crossfade settings must be one more than the number of
          crossfade frequencies.

  - name: LastPacketPLC
    settings:
      - name: crossfade
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: fade_in
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: crossfade_frequencies
        type: list_int
        default: []
        values: null
        validation:
          item:
            min: 0
            max: 20000
          sorted: ascending
      - name: crossover_order
        type: int
        default: 4
        values: null
        validation:
          min: 1
      - name: mirror_x
        type: bool
        default: false
        values: null
      - name: mirror_y
        type: bool
        default: false
        values: null
      - name: clip_strategy
        type: Enum
        default: subtract
        values:
          - subtract
          - clip
    constraints:
      - type: length_relation
        setting: crossfade
        related_setting: crossfade_frequencies
        offset: 1
        message: >-
          The number of crossfade settings must be one more than the number of
          crossfade frequencies.

  - name: LowCostPLC
    settings:
      - name: crossfade
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: fade_in
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: crossfade_frequencies
        type: list_int
        default: []
        values: null
        validation:
          item:
            min: 0
            max: 20000
          sorted: ascending
      - name: crossover_order
        type: int
        default: 4
        values: null
        validation:
          min: 1
      - name: max_frequency
        type: float
        default: 4800
        values: null
        validation:
          min: 0
      - name: f_min
        type: int
        default: 80
        values: null
        validation:
          min: 0
      - name: beta
        type: float
        default: 1
        values: null
        validation:
          min: 0
      - name: n_m
        type: int
        default: 2
        values: null
        validation:
          min: 0
      - name: fade_in_length
        type: int
        default: 10
        values: null
        validation:
          min: 0
      - name: fade_out_length
        type: float
        default: 0.5
        values: null
        validation:
          min: 0
      - name: extraction_length
        type: int
        default: 2
        values: null
        validation:
          min: 0
    constraints:
      - type: length_relation
        setting: crossfade
        related_setting: crossfade_frequencies
        offset: 1
        message: >-
          The number of crossfade settings must be one more than the number of
          crossfade frequencies.
      - type: less_than
        setting: f_min
        related_setting: max_frequency
        message: >-
          The minimum frequency must be less than the maximum frequency.

  - name: BurgPLC
    settings:
      - name: crossfade
