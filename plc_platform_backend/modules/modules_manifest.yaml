          sorted: ascending
      - name: crossover_order
        type: int
        default: 4
        values: null
        validation:
          min: 1
      - name: context_length
        type: int
        default: 100
        values: null
        validation:
          min: 1
      - name: order
        type: int
        default: 1
        values: null
        validation:
          min: 1
    constraints:
      - type: length_relation
        setting: crossfade
        related_setting: crossfade_frequencies
        offset: 1
        message: >-
          The number of crossfade settings must be one more than the number of
          crossfade frequencies.

  - name: VermaPLC
    settings:
      - name: crossfade
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: fade_in
        type: list_CrossfadeSettings
        default:
          - name: NoCrossfadeSettings
            settings: []
        values: null
      - name: crossfade_frequencies
        type: list_int
        default: []
        values: null
