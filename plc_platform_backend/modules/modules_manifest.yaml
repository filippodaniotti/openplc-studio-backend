      - name: hop_size
        type: int
        default: 160
        values: null
        validation:
          min: 1
      - name: window_length
        type: int
        default: 480
        values: null
        validation:
          min: 1
      - name: lower_edge_hertz
        type: float
        default: 40
        values: null
